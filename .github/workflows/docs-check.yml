# Is the documentation up to date with the code? tests/check_docs.py compares README, docs/ and the site pages with what
# the code defines (views, commands, counts, DOI, links, outdated phrasings). A failed run means a document needs an update.
name: docs up to date
on:
  push:
    branches: [main, multirev]
  schedule:
    - cron: '0 6 * * 1'          # Mondays 06:00 UTC
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/check_docs.py
